[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "peltolohko"
dynamic = ["version"]
description = "Beanstalkin etusivu: peltolohkonumerosta, koordinaateista, alueesta tai satotiedostosta Beanstalk Yield, Growth Analysis ja Space"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Miiro Jääskeläinen" }]
dependencies = []  # vain standardikirjasto; analyysityökalut asennetaan erikseen

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
peltolohko = "peltolohko.cli:main"

[tool.hatch.version]
path = "src/peltolohko/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/peltolohko"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]  # lyhyet arvoaluetarkistimet lambdoina
